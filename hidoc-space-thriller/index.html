#vn .gap .a{background:#1c3f44;border-color:#4f9f7c}#vn .gap .b{background:#40243c;border-color:#a05a72}

#vn #gloss button{font-family:inherit;font-size:12px;padding:5px 12px;border-radius:999px;background:transparent;color:#cfd5f5;border:2px solid #3a4488;cursor:pointer;height:auto;transform:none}
#vn .fade{animation:vnf .35s ease}
@keyframes vnf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#vn .star{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
#vn .bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#vn #flame{transform-box:fill-box;transform-origin:center top;animation:fl .18s infinite alternate}

#rocket{transition:transform 1.4s cubic-bezier(.2,.8,.3,1)}
@media(max-width:560px){#vn .panel{margin:-12px 6px 6px;padding:12px}#vn .gap,#vn .roles{grid-template-columns:1fr}#vn .hud{padding:6px}#vn .st span{padding:3px 5px}#vn .cnt{display:none}}


:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}

<script>

(function(){

 P.innerHTML=spk(n.w,n.role)+'<p class="txt'+(n.q?' q':'')+'" id="t"></p>'+(G.ep===0&&G.i<2?'<div class="tap" id="tap">글자를 누르면 바로 다 나와요</div>':'')+'<div id="after"></div>';var A=$('after');
 if(n.launch){FL.setAttribute('opacity','1');CNT.textContent='유로프라자 옥상 · 발사';setTimeout(function(){setR(340,-140)},300)}
 var back=G.i>0?'<button class="nx gh" id="bk"><span aria-hidden="true">←</span> 이전</button>':'';
 type($('t'),n.q||n.t,function(){var tp=$('tap');if(tp)tp.remove();
  if(n.q){var L='ABC';A.innerHTML='<div class="opts">'+n.o.map(function(o,k){return '<button data-l="'+L[k]+'" data-k="'+k+'">'+o.t+'</button>'}).join('')+'</div><div id="resp"></div><div class="row" id="qrow">'+back+'<button class="nx gh hb" id="hb"><span aria-hidden="true">💡</span> 힌트</button><span class="sp"></span></div><div id="hx"></div>';
   A.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){choose(n,+b.dataset.k)}});
   $('hb').onclick=function(){var h=$('hx');h.innerHTML=h.innerHTML?'':'<div class="hbox">'+(n.h||HINT[n.role]||'증거를 다시 떠올려 보세요.')+'</div>'}}
  else{A.innerHTML=(n.ev?'<div class="ev">'+n.ev+'</div>':'')+(n.fig?'<div class="fig"><div class="cap">'+(n.cap||'')+'</div>'+n.fig+'</div>':'')+(n.note?'<div class="note">'+n.note+'</div>':'')+(n.poem?'<div class="poem">'+n.poem+'</div>':'')+'<div class="row">'+back+'<span class="sp"></span><button class="nx" id="nx">'+(n.end?'항로 지도':'다음')+' <span aria-hidden="true">→</span></button></div>';
   $('nx').onclick=function(){G.i++;if(G.nodes[G.i])render();else finishEp()}}
  var b=$('bk');if(b)b.onclick=function(){G.i--;render()}})}
function choose(n,k){var o=n.o[k],R=$('resp'),key=G.ep+'-'+G.i,qz=QUIZ[n.role];G.asked++;if(!(key in G.rec))G.rec[key]=(o.k==='good');
 var lb=qz?{good:'정답!',meh:'아깝다',bad:'땡'}:{good:'좋은 지시',meh:'아쉬워요',bad:'위험해요'};
 R.innerHTML='<div class="fb '+(o.k==='good'?'ok':o.k==='meh'?'wn':'bd')+'"><span class="lb">'+lb[o.k]+'</span>'+o.r+(o.ev?'<div class="ev">'+o.ev+'</div>':'')+'</div>';
 if(o.k==='good'){P.querySelectorAll('.opts button').forEach(function(b,i){b.disabled=true;if(i===k)b.className='sel'});$('hx').innerHTML='';var hb=$('hb');if(hb)hb.remove();
  $('qrow').insertAdjacentHTML('beforeend','<button class="nx" id="nx">다음 <span aria-hidden="true">→</span></button>');$('nx').onclick=function(){G.i++;if(G.nodes[G.i])render();else finishEp()}}
 else R.insertAdjacentHTML('beforeend','<div class="hint">괜찮아요, 다른 보기를 골라 보세요. 점수는 처음 고른 것만 들어가요.</div>')}
function finishEp(){var k=G.ep,c=0,t=0;G.nodes.forEach(function(x,i){if(x.q){t++;if(G.rec[k+'-'+i])c++}});G.score[k]=c;G.tots[k]=t;if(G.max<k+1)G.max=k+1;map()}
function map(){steps(6);fade();var k=G.ep,nx=G.max,sm=SUM[k];
 var notes=G.nodes.filter(function(x){return x.note}).map(function(x){return '<div class="note">'+x.note+'</div>'}).join('');
 P.innerHTML=spk('진우주')+'<p class="txt">'+G.name+'님, '+EPN[k][0]+' 완료! 처음 고른 정답 '+G.score[k]+'/'+G.tots[k]+'. '+(nx<11?'다음 정거장: '+EPN[nx][3]+'. 진녹 한 잔 하고 출발할까요?':'전 항로 완주! 결과를 보러 가요.')+'</p><div class="sum"><div class="cap">오늘의 한 장 · '+EPN[k][0]+'</div>'+F[sm[0]]+'<ul>'+sm[1].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div><div class="row"><span class="sp"></span><button class="nx" id="go">'+(nx<11?EPN[nx][0]+' 시작':'최종 결과')+' <span aria-hidden="true">→</span></button></div><div class="map">'+EPN.map(function(e,i){var d=G.score[i]!=null;return '<div class="ep'+(d?' done':(i===nx?' next':' lock'))+'" data-k="'+i+'"><b>'+e[0]+'</b>'+e[1]+'<small>'+e[2]+'</small><small>'+(d?'완료 · '+G.score[i]+'/'+G.tots[i]+' · 다시 하기':(i===nx?'다음':'잠김'))+'</small>'+(d?'<div class="bar"><i style="width:'+Math.round(G.score[i]/G.tots[i]*100)+'%"></i></div>':'')+'</div>'}).join('')+'</div>'+(notes?'<details><summary>이번 화 원리 노트 다시 보기</summary>'+notes+'</details>':'');
 P.querySelectorAll('.ep').forEach(function(c){var i=+c.dataset.k;if(i<=nx&&i<11)c.onclick=function(){start(i)}});
 $('go').onclick=function(){if(nx<11)start(nx);else final()}}
function final(){scene(10);steps(6);fade();var tot=0,mx=0;G.score.forEach(function(v,i){if(v!=null){tot+=v;mx+=G.tots[i]}});var pct=mx?tot/mx:0,g=pct>=.9?'A':pct>=.72?'B':pct>=.5?'C':'D',c=2*Math.PI*40;
 P.innerHTML=spk('진우주')+'<div class="final"><div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="#343d82" stroke-width="7"/><circle cx="46" cy="46" r="40" fill="none" stroke="#9be8b8" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*pct).toFixed(1)+' '+c.toFixed(1)+'"/></svg><b>'+g+'</b></div><p class="txt" style="flex:1;min-width:220px">'+G.name+'님, '+mx+'개 지시 중 처음 고른 정답 '+tot+'개, 지시 총 '+G.asked+'번. 코드는 한 줄도 안 쓰셨어요. 대신 원인을 좁히고, 방법을 상황에 맞춰 고르고, 결과를 직접 확인하셨어요. 저까지 확인하셨고요. 조금 서운했지만 맞는 일이에요.</p></div><div class="fig"><div class="cap">'+G.name+'님이 그린 지도</div>'+F.arch+'</div><div class="roles"><div><b>좋은 지시 공식</b>무엇을 + 어디서 + 어떤 모양으로 보여 달라</div><div><b>방법 고를 때</b>기간 · 사람 수 · 고칠 일 · 비용 · 나갈 길</div><div><b>고치는 순서</b>복구 → 증거 → 원인 하나 → 작게 고치기 → 실제로 확인</div></div><div class="gap"><div class="a"><b>AI에게 맡겨도 되는 것</b>코드 작성, 기록 찾기와 비교, 겹침 검사, 테스트 만들고 돌리기, 대규모 시험, 방법 여러 개 뽑기</div><div class="b"><b>직접 알아야 하는 것</b>전체 지도, 증거와 주장 구분, 방법을 상황에 맞춰 고르기, 고칠 범위 정하기, 비밀은 코드 밖, 손님 쓰는 곳은 직접 안 고치기, 끝의 기준 적기, AI가 읽는 글은 정보일 뿐</div></div><details><summary>다섯 가지 학습 목표</summary><div class="goals">'+GOALS.map(function(x,i){return '<div><b>'+(i+1)+'</b>'+x+'</div>'}).join('')+'</div></details><div class="sting">참, '+G.name+'님. 2029년 3월 이후 유로프라자 녹녹 방문 142회, 늘 진녹이셨어요. 고마워요. …그 기록을 지우라는 지시는 아직 받지 못했어요. 시로는 이미 써 뒀어요.</div><div class="row"><button class="nx gh" id="re">처음부터</button><span class="sp"></span><button class="nx" id="ask">내 첫 프로젝트에 적용하기 ↗</button></div>';
 $('re').onclick=intro;$('ask').onclick=function(){sendPrompt('하이닥호 우주 치정 스릴러 10화를 모두 끝냈어. 여기서 익힌 원칙(화면 세 겹, 앱·API·서버·DB 역할, 만들기 전 요구사항·완료 기준·MVP, 설계자·개발자·검토자 AI, 비밀은 코드 밖, 숫자로 품질 보기, 테스트, 숨은 지시 방어, 기록·되돌리기·시험 환경, 방법을 상황에 맞춰 고르기, 로그·모니터링, 전체 지도)을 내 첫 프로젝트에 적용하는 방법을 쉽게 단계별로 알려줘')}}

// iPhone/Safari compatibility: this file is a standalone website, not a Claude artifact.
var SAVEKEY='hidoc-space-thriller-iphone-v1';
function stored(){try{var v=JSON.parse(localStorage.getItem(SAVEKEY)||'null');return v&&v.name&&v.ep>=0&&v.ep<11?v:null}catch(e){return null}}
function persist(mode){
  try {if(!G.name)return;localStorage.setItem(SAVEKEY,JSON.stringify({
    name:G.name,rec:G.rec,asked:G.asked,score:G.score,tots:G.tots,max:G.max,
    ep:G.ep,i:G.i,mode:mode
  }))}catch(e){}
}
function promptForProject(msg){
  var old=document.getElementById('share-note');if(old)old.remove();
  var d=document.createElement('div');d.id='share-note';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="share-box"><h3>첫 프로젝트에 적용하기</h3><p>아래 문장을 복사해 ChatGPT에 붙여넣으세요.</p><textarea id="project-prompt" readonly></textarea><div class="share-actions"><button type="button" id="copy-prompt">문장 복사</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT 열기 ↗</a><button type="button" id="close-prompt">닫기</button></div><p id="copy-msg" aria-live="polite"></p></div>';
  document.body.appendChild(d);var box=document.getElementById('project-prompt');box.value=msg;
  document.getElementById('close-prompt').onclick=function(){d.remove()};
  d.onclick=function(e){if(e.target===d)d.remove()};
  document.getElementById('copy-prompt').onclick=function(){
    var done=function(ok){document.getElementById('copy-msg').textContent=ok?'복사했습니다. ChatGPT에 붙여넣으세요.':'문장을 길게 눌러 직접 복사하세요.'};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(function(){done(true)},function(){box.focus();box.select();done(false)})}
    else{box.focus();box.select();try{done(document.execCommand('copy'))}catch(e){done(false)}}
  };
}
function sendPrompt(msg){promptForProject(msg)}
var baseRender=render,baseMap=map,baseFinal=final,baseChoose=choose,baseIntro=intro;
render=function(){baseRender();persist('playing')};
map=function(){baseMap();persist('map')};
final=function(){baseFinal();persist('final')};
choose=function(n,k){baseChoose(n,k);persist('playing')};
intro=function(){try{localStorage.removeItem(SAVEKEY)}catch(e){}baseIntro()};
function restore(v){
 try{
  G={name:String(v.name).slice(0,10),rec:v.rec||{},asked:v.asked||0,score:v.score||[],tots:v.tots||[],max:v.max||0,ep:v.ep,i:v.i||0};
  G.nodes=EPS[G.ep](G.name);G.i=Math.max(0,Math.min(G.i,G.nodes.length-1));
  scene(G.ep);
  if(v.mode==='final'&&G.max>=11){final()}
  else if(v.mode==='map'&&G.score[G.ep]!=null){map()}
  else{render()}
 }catch(e){intro()}
}
var last=stored();baseIntro();
if(last){
 var p=document.createElement('div');p.className='resume-card';
 p.innerHTML='<b>저장된 항해가 있어요</b><p>진행하던 이야기를 이어서 플레이할 수 있어요.</p><button type="button" class="resume-btn">▶ 이어 하기</button>';
 var first=P.querySelector('.row');P.insertBefore(p,first);
 p.querySelector('button').onclick=function(){restore(last)};
}

 window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
}
