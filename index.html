<html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>

<style>
:root{--surface-0:#070b1f;--surface-1:rgba(255,255,255,.07);--surface-2:rgba(255,255,255,.05);--text-primary:#f4f2ff;--text-secondary:#bdb9de;--text-muted:#8a86b3;--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-stronger:rgba(255,255,255,.45);--bg-accent:rgba(139,123,255,.2);--text-accent:#cfc6ff;--border-accent:#8b7bff;--bg-success:rgba(79,227,193,.15);--text-success:#86f2d7;--bg-warning:rgba(255,214,107,.14);--text-warning:#ffd66b;--border-warning:#e8b84a;--bg-danger:rgba(255,120,150,.15);--text-danger:#ffa3b8;--border-danger:#ff7896;--radius:14px;--font-voice:'Gowun Dodum',serif;--disp:'Jua','Gowun Dodum',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--text-primary);font-family:'Gowun Dodum',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;font-size:16px;line-height:1.7;background:radial-gradient(ellipse 70% 50% at 15% 5%,#2c1c66 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 85%,#0e3d63 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 70% 30%,rgba(255,120,190,.12) 0%,transparent 70%),linear-gradient(180deg,#070b1f 0%,#120a2e 55%,#05060f 100%);background-attachment:fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#deco{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#deco .fl{position:absolute;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:18px 18px 90px}
.w{padding:.75rem 0}
.disp{font-family:var(--disp);letter-spacing:.2px;font-weight:400}
button{font:inherit;font-size:14px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--text-primary);cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s}
button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.32)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid #8b7bff;outline-offset:2px}
.btn-main{background:linear-gradient(135deg,#9a8cff 0%,#6fb8ff 55%,#5fe0c8 100%);border:none;color:#140f33;font-family:var(--disp);font-size:18px;min-height:52px;padding:0 28px;box-shadow:0 10px 28px rgba(110,130,255,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-main:hover{filter:brightness(1.07);background:linear-gradient(135deg,#9a8cff 0%,#6fb8ff 55%,#5fe0c8 100%);transform:translateY(-2px)}
input,select,textarea{font:inherit;font-size:15px;min-height:46px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(8,6,28,.55);color:var(--text-primary);outline:none;transition:border-color .2s,box-shadow .2s}
textarea{padding:10px 14px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:#7d79a6}
input:focus,select:focus,textarea:focus{border-color:#8b7bff;box-shadow:0 0 0 3px rgba(139,123,255,.25)}
select option{background:#16113a;color:#fff}
.card{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:1.1rem 1.25rem;margin:0 0 1rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:999px;background:var(--bg-accent);color:var(--text-accent);margin:0 6px 6px 0;border:1px solid rgba(139,123,255,.35)}
.mut{color:var(--text-secondary);font-size:15px;line-height:1.75;word-break:keep-all}
.sm{font-size:13px;color:var(--text-secondary);line-height:1.65;word-break:keep-all}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.met{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px}
.sec{font-family:var(--disp);font-size:23px;margin:2.8rem 0 .5rem;scroll-margin-top:12px;background:linear-gradient(90deg,#ffffff,#cfc6ff 55%,#86f2d7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sel{border:2px solid #9a8cff!important;background:rgba(139,123,255,.26)!important;color:#fff!important;box-shadow:0 0 22px rgba(139,123,255,.5)!important}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 36px;gap:10px;align-items:center;margin:7px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
details summary{cursor:pointer;color:var(--text-accent);font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
.float{animation:float 4.8s ease-in-out infinite}
.mascot .arm{transform-origin:64px 128px;animation:wave 1.8s ease-in-out infinite}
.mascot .tw{transform-origin:100px 13px;animation:twk 2.2s ease-in-out infinite}
.spin{animation:spin .9s cubic-bezier(.3,1.5,.5,1)!important}
.in{animation:inR .34s cubic-bezier(.2,.8,.2,1)}
.out{animation:outL .18s ease-in forwards}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.tossed{animation:toss .42s ease-in forwards!important;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes twk{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.18)}}
@keyframes spin{from{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.15)}to{transform:rotate(360deg) scale(1)}}
@keyframes inR{from{opacity:0;transform:translateX(42px) scale(.98)}to{opacity:1;transform:none}}
@keyframes outL{to{opacity:0;transform:translateX(-52px) scale(.97)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes toss{to{opacity:0;transform:translate(240px,-300px) rotate(50deg) scale(.35)}}
@keyframes shimmer{0%{background-position:0 0,0% 50%}100%{background-position:0 0,300% 50%}}
@keyframes ping{from{transform:scale(.45);opacity:.9}to{transform:scale(1.35);opacity:0}}
.qcard{position:relative;padding:1.4rem 1.4rem 1.2rem}
.qtext{font-size:22px;line-height:1.6;min-height:104px;margin:.5rem 0 1.5rem;word-break:keep-all}
.dots{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px}
.dot{border-radius:50%;padding:0;min-height:0;border:2.5px solid;background:transparent;flex:none;transition:transform .15s,background .15s,box-shadow .2s}
.dot:hover{transform:scale(1.12);background:rgba(255,255,255,.08)}
.dot.on{animation:pop .26s}
.dl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-secondary);margin-top:12px;padding:0 2px;gap:8px}
.orbit{position:relative;height:46px;margin:2px 0 10px}
.orbit .trk{position:absolute;left:14px;right:14px;top:22px;border-top:2px dashed rgba(255,255,255,.18)}
.orbit .done{position:absolute;left:14px;top:21px;height:4px;border-radius:4px;background:linear-gradient(90deg,#9a8cff,#6fb8ff,#5fe0c8);box-shadow:0 0 14px rgba(111,184,255,.75);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.orbit .pl{position:absolute;top:12px;width:22px;height:22px;border-radius:50%;transform:translateX(-50%)}
.orbit .rk{position:absolute;top:5px;transform:translateX(-50%);transition:left .45s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(255,200,120,.85))}
.holo{position:relative;border:1.5px solid transparent!important;background:linear-gradient(160deg,rgba(32,24,78,.92),rgba(14,11,38,.92)) padding-box,linear-gradient(115deg,#9a8cff,#6fb8ff,#5fe0c8,#ff9fd0,#ffd66b,#9a8cff) border-box!important;background-size:auto,300% 300%!important;animation:shimmer 7s linear infinite}
.radar{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:2px solid rgba(95,224,200,.55);animation:ping 1.9s ease-out infinite}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);z-index:50;transition:transform .38s cubic-bezier(.2,.9,.25,1.15);display:flex;align-items:center;gap:10px;background:rgba(22,17,56,.94);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 20px 6px 8px;box-shadow:0 12px 34px rgba(0,0,0,.5);max-width:92vw;font-size:14px;line-height:1.45}
#toast.show{transform:translate(-50%,0)}
.bubble{display:inline-block;background:#fff;color:#2b2350;border-radius:18px;padding:9px 16px;font-size:15px;line-height:1.5;box-shadow:0 8px 22px rgba(0,0,0,.35);font-family:var(--disp)}
#egg{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at center,rgba(30,20,80,.92),rgba(3,4,15,.97));cursor:pointer;animation:rise .4s ease both}
.goldstar{pointer-events:auto;cursor:pointer;animation:twk 2.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #ffd66b)}
.w>p[style*='font-size:24px']{font-family:var(--disp)}
@media (max-width:520px){.qtext{font-size:19px;min-height:120px}.row{grid-template-columns:78px minmax(0,1fr) 32px}.wrap{padding:12px 14px 90px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{#sky,#deco,#toast{display:none!important}body{background:#fff!important;color:#111}.card{box-shadow:none;background:#fff;border-color:#ccc}.sec{color:#222;background:none}}

E:[[0,'아직 일어나지 않은 일이 잘못될까 걱정하느라 잠을 설친 적이 자주 있다.'],[1,'번지점프나 혼자 하는 밤 산행처럼 위험해 보이는 활동도 크게 두렵지 않다.'],[0,'힘든 일이 생기면 누군가에게 털어놓아야 마음이 정리된다.'],[0,'슬픈 영화나 다른 사람의 사연에 쉽게 눈시울이 붉어진다.'],[1,'중요한 발표나 시험 전날에도 비교적 평소처럼 잠들 수 있다.'],[1,'어려운 문제는 남의 도움 없이 혼자 해결하는 편이 마음 편하다.'],[0,'가까운 사람과 오래 떨어져 지내면 마음이 크게 흔들린다.'],[1,'비판을 들어도 그날 저녁까지 마음에 남아 있지는 않다.']],

A:[[0,'나에게 상처 준 사람이 진심으로 사과하면 비교적 빨리 마음이 풀린다.'],[1,'다른 사람의 실수를 보면 그 자리에서 지적해야 직성이 풀린다.'],[0,'내 생각이 맞다고 확신해도, 관계를 위해 한발 물러설 때가 많다.'],[1,'일이 느리게 진행되면 짜증이 표정에 그대로 드러난다.'],[1,'사람을 볼 때 장점보다 단점이 먼저 눈에 들어온다.'],[0,'언성이 높아지는 상황에서도 나는 대체로 목소리를 낮춘다.'],[1,'한 번 나를 실망시킨 사람은 다시 믿기 어렵다.'],[0,'상대가 무리한 요구를 해도 화내기 전에 사정을 먼저 묻는다.']],

O:[[0,'전시, 공연, 아름다운 건축물을 보러 일부러 시간을 낸다.'],[0,'과학·역사·철학 같은 주제를 업무와 상관없이 찾아 읽는다.'],[1,'검증된 방식이 있다면 굳이 새로운 방법을 시도할 이유가 없다.'],[0,'남들이 엉뚱하다고 하는 아이디어에 오히려 끌린다.'],[1,'‘자유의지는 존재하는가’ 같은 추상적인 토론은 시간 낭비처럼 느껴진다.'],[0,'혼자 무언가를 상상하거나 구상하는 시간이 즐겁다.'],[1,'낯선 나라의 음식이나 문화보다 익숙한 것이 좋다.'],[0,'관습적인 정답보다 ‘왜 꼭 그렇게 해야 하지?’를 먼저 묻는다.']]};
const B2={R:['고장 난 가전제품을 분해하고 부품을 갈아 끼워 고친다.','목공 공방에서 도면대로 나무를 자르고 조립해 가구를 만든다.','공장 생산 라인의 기계 설정을 조정해 불량률을 낮춘다.','야외에서 측량 장비로 지형을 측정한다.','자전거를 분해해 정비하고 다시 조립한다.','텃밭이나 농장에서 작물을 기르고 수확한다.','조명이나 선반 같은 생활 설비를 직접 설치한다.','3D 프린터나 공구를 다뤄 실제 물건을 만들어낸다.'],
I:['실험을 설계해서 가설이 맞는지 검증한다.','수천 줄의 데이터에서 숨은 패턴을 찾아낸다.','질병이 생기는 원리를 논문을 읽으며 파고든다.','왜 그런 현상이 생기는지 원리를 이해할 때까지 붙들고 있는다.','복잡한 수학·논리 퍼즐을 푼다.','신기술의 작동 원리를 조사해 분석 보고서를 쓴다.','현미경이나 분석 장비로 시료를 관찰한다.','경제 지표가 왜 바뀌었는지 원인을 분석한다.'],

S:['진로나 고민이 있는 사람의 이야기를 들어주고 함께 길을 찾는다.','초보자에게 어려운 내용을 쉽게 가르친다.','아프거나 다친 사람을 돌보고 회복을 돕는다.','갈등이 생긴 두 사람 사이를 중재한다.','지역사회나 봉사 단체의 프로그램을 운영한다.','새로 온 동료가 잘 적응하도록 옆에서 챙긴다.','아이들이나 청소년의 성장을 돕는 활동을 한다.','도움이 필요한 사람을 알맞은 지원 제도에 연결해 준다.'],
E:['사람들을 설득해 내 아이디어에 투자하게 만든다.','팀을 이끌고 목표 매출을 달성한다.','새로운 사업을 기획하고 직접 시장에 내놓는다.','협상 테이블에서 더 좋은 조건을 끌어낸다.','행사나 프로젝트의 책임자로 전체 판을 지휘한다.','사람들 앞에서 내 계획을 발표해 지지를 얻어낸다.','처음 보는 고객에게 제품을 소개하고 계약을 따낸다.','조직의 방향을 정하는 회의에서 결정권을 갖는다.'],
C:['흩어진 자료를 표로 정리해 한눈에 보이게 만든다.','예산과 지출 내역을 꼼꼼히 맞춰 본다.','업무 절차를 매뉴얼로 문서화한다.','일정·재고·인원 같은 운영 데이터를 관리한다.','계약서나 서류에서 누락과 오류를 찾아낸다.','반복 업무를 체크리스트로 만들어 실수를 없앤다.','회계 장부나 세금 서류를 처리한다.','파일과 기록을 체계적인 규칙으로 분류해 보관한다.']};
const B3={TF:['승진해서 관리자가 되기보다, 한 분야의 최고 전문가로 남고 싶다.','“그건 저 사람한테 물어봐”라는 말을 들을 때 가장 뿌듯하다.','내 전문 분야와 상관없는 일을 계속 맡게 되면 이직까지 고민하게 된다.','깊이 있는 실력을 쌓는 데 몇 년이 걸려도 괜찮다.','연봉이 조금 낮아도 내 기술을 더 깊게 쓸 수 있는 곳을 고르겠다.','다른 분야로 옮기면 연봉이 오르더라도, 지금 쌓은 전문성을 버리는 건 아깝다.'],
GM:['여러 부서의 사람과 자원을 조율해 큰 결과를 만드는 자리가 탐난다.','결국 조직에서 책임과 권한이 큰 위치에 오르고 싶다.','내 손으로 직접 하는 것보다, 사람들이 잘하게 만드는 것이 더 보람 있다.','조직 전체의 숫자(매출, 이익)를 책임지는 역할이 부담보다 흥미롭다.','전문가로 남는 길과 리더가 되는 길 중 리더를 택하겠다.','복잡한 상황에서 최종 결정을 내리는 사람이 되고 싶다.'],
AU:['출퇴근 시간과 일하는 방식을 내가 정할 수 있어야 한다.','누군가 내 업무를 세세하게 확인하면 의욕이 급격히 떨어진다.','안정적인 대기업보다, 덜 안정적이어도 내 재량이 큰 곳이 좋다.','결과만 보여준다면 과정에는 아무도 간섭하지 않길 바란다.','프리랜서나 1인 사업 형태로 일하는 모습이 매력적이다.','일하는 방법까지 정해주는 매뉴얼은 답답하게 느껴진다.'],
SE:['높은 연봉보다 오래 다닐 수 있는 것이 더 중요하다.','다음 달 수입이 불확실하면 다른 일이 손에 잡히지 않는다.','예측 가능한 업무와 명확한 승진 체계가 있는 조직이 편하다.','이직 제안이 와도 지금 회사가 안정적이면 남는 쪽을 택한다.','연금, 복지, 고용 보장이 직장 선택의 핵심 조건이다.','회사를 고를 때 가장 먼저 보는 것은 그 회사의 재무 안정성이다.'],
EC:['언젠가 내 이름을 건 사업이나 브랜드를 만들고 싶다.','아무것도 없는 상태에서 무언가를 만들어 세상에 내놓을 때 가장 살아있다고 느낀다.','월급을 받으면서도 사이드 프로젝트 아이디어를 늘 굴리고 있다.','실패해서 돈을 잃더라도 내 것을 시도해 보는 편이 낫다.','남이 만든 시스템을 운영하는 것보다 새로 만드는 것이 좋다.','내가 만든 것이 커가는 걸 지켜보는 것이 가장 큰 보상이다.'],
SV:['연봉이 낮아도 사회에 의미 있는 일을 하고 싶다.','내 일이 누군가의 삶을 실제로 낫게 한다는 확신이 있어야 버틸 수 있다.','회사의 가치관이 내 신념과 어긋나면 그만두는 것을 고민한다.','환경, 교육, 건강, 인권 같은 문제를 해결하는 일에 끌린다.','“이 일이 누구에게 도움이 되는가”를 자주 스스로 묻는다.','돈을 많이 벌어도 의미 없는 일이라면 공허할 것 같다.'],
CH:['남들이 불가능하다고 하는 문제일수록 더 해보고 싶다.','경쟁에서 이기는 순간의 짜릿함이 일의 큰 동기다.','너무 쉬운 일이 반복되면 금방 지루해서 일을 바꾸고 싶어진다.','어렵고 까다로운 프로젝트에 일부러 자원한 적이 있다.','나보다 뛰어난 사람들과 겨룰 수 있는 환경을 원한다.','편안함보다 성장의 압박이 있는 곳이 낫다.'],
LS:['일이 아무리 좋아도 가족과 개인 시간을 희생하고 싶지는 않다.','야근이 잦은 고연봉보다 정시 퇴근이 보장된 적정 연봉을 택하겠다.','일, 건강, 관계, 취미가 균형을 이루는 것이 내 성공의 기준이다.','살고 싶은 지역이나 생활 리듬을 위해 승진 기회를 포기할 수 있다.','퇴근 후에도 업무 연락이 오는 직장은 아무리 좋아도 피하고 싶다.','일은 내 삶의 일부일 뿐, 중심은 아니다.']};

function runSim(seed){const r=rng(seed),P=[];for(let i=0;i<100;i++)P.push(persona(r,i));const out={1:[],2:[]};P.forEach((p,i)=>{[1,2].forEach(alg=>{out[alg][i]=[0,1,2].map(run=>{const key=seed+'-'+i+'-'+run,rp=simResp(p,key,alg);let tbN=0;if(alg==1){const plan=tbPlan1(rp);tbN=plan.length;rp.tbAns=plan.map(q=>({sys:q.sys,a:q.a,b:q.b,win:chooseC(p,q,key)}))}return {rp,R:core(rp,alg),tbN,nIt:rp.items.length+tbN}})})});return {seed,P,out}}
function metrics(P,O){const n=P.length,prs=[[0,1],[0,2],[1,2]],m3=3*n;const lv=(p,d,k)=>d=='h'?p.hz[k]:d=='r'?p.rz[k]:p.az[k],ev=(R,d,k)=>d=='h'?R.H[k]:d=='r'?R.RS[k]:R.AS[k],ks=d=>d=='h'?HK:d=='r'?RK:AK;
const rec=d=>avg(ks(d).map(k=>avg([0,1,2].map(t=>pear(P.map(p=>lv(p,d,k)),O.map(x=>ev(x[t].R,d,k)))))));const rt=d=>avg(ks(d).map(k=>avg(prs.map(([a,b])=>pear(O.map(x=>ev(x[a].R,d,k)),O.map(x=>ev(x[b].R,d,k)))))));
const set=s=>s.split('+'),dis=(a,b)=>!set(a).some(v=>set(b).includes(v)),tr=P.map(p=>amax(p.rz)),ta=P.map(p=>amax(p.az));
let accRep=0,accRepA=0,cR=0,cA=0,flip=0,mis=0,conf=0,accJ=0,t3=0,t15=0,nIt=0,tie=0,se=0,seN=0,fa=0,faN=0,fk=0,fkN=0,sfa=0;
P.forEach((p,i)=>{const x=O[i];x.forEach(e=>{if(set(e.R.repR).includes(tr[i][0]))accRep++;if(e.R.repR.includes('+'))tie++;if(set(e.R.repA).includes(ta[i][0]))accRepA++;if(tr[i].slice(0,2).includes(e.R.fits[0].j.code[0]))accJ++;nIt+=e.nIt;HK.forEach(f=>{const l=e.R.lab3[f];if(l!='M'){conf++;if((l=='H')!=(p.hz[f]>0))mis++}});if(p.type=='careless'){seN++;if(e.R.rel<60)se++}else if(p.type=='normal'){faN++;if(e.R.rel<60)fa++;if(e.R.sdFlag)sfa++}if(p.type=='faker'){fkN++;if(e.R.sdFlag)fk++}});
if(prs.some(([a,b])=>dis(x[a].R.repR,x[b].R.repR)))cR++;if(prs.some(([a,b])=>dis(x[a].R.repA,x[b].R.repA)))cA++;HK.forEach(f=>{const l=x.map(e=>e.R.lab3[f]);if(l.includes('H')&&l.includes('L'))flip++});
prs.forEach(([a,b])=>{const A3=x[a].R.fits.slice(0,3).map(o=>o.ix),B3=x[b].R.fits.slice(0,3).map(o=>o.ix);if(A3.some(v=>B3.includes(v)))t3++;if(x[b].R.fits.slice(0,5).some(o=>o.ix==x[a].R.fits[0].ix))t15++})});
return {recH:rec('h'),recR:rec('r'),recA:rec('a'),rtH:rt('h'),rtR:rt('r'),rtA:rt('a'),accRep:accRep/m3,contraR:cR/n,accRepA:accRepA/m3,contraA:cA/n,flipL:flip/(6*n),mis:conf?mis/conf:0,top3any:t3/m3,top1in5:t15/m3,accJ:accJ/m3,sens:seN?se/seN:0,fa:faN?fa/faN:0,fakerDet:fkN?fk/fkN:0,sdFA:faN?sfa/faN:0,tieR:tie/m3,nItems:nIt/m3}}
function runBatch(seeds){const acc={1:[],2:[]};seeds.forEach(sd=>{const s=runSim(sd);[1,2].forEach(a=>acc[a].push(metrics(s.P,s.out[a])))});const res={};[1,2].forEach(a=>{const m={};Object.keys(acc[a][0]).forEach(k=>m[k]=Math.round(avg(acc[a].map(x=>x[k]))*1000)/1000);res[a==1?'v1':'v4']=m});return res}
const ENGINE_END=1;
</script>

const PARTS={1:{n:'1부 성향',c:'#7F77DD',hint:'지난 1년간의 실제 나를 떠올리며',title:'1부 · 나는 어떤 사람인가',guide:'되고 싶은 모습이 아니라 지난 1년간 실제로 어떻게 행동했는지를 떠올리세요. 직장에서의 나와 집에서의 나가 다르다면, 더 자주 나오는 쪽을 고르세요.',sci:'HEXACO 6요인 모델 기반 48문항. 형용사 대신 구체적 행동으로 묻고, 절반가량을 반대 방향 문항으로 배치했습니다. 그래도 남는 “무조건 그렇다” 경향은 개인별로 계산해 점수에서 보정합니다.'},2:{n:'2부 흥미',c:'#1D9E75',hint:'잘하는지, 돈이 되는지는 잊고 · 이 활동에 끌리는가',title:'2부 · 무엇이 나를 끌어당기는가',guide:'잘할 수 있는지, 돈이 되는지, 남들이 어떻게 볼지는 잊으세요. 그 활동을 하는 장면을 떠올렸을 때 하고 싶은 마음이 드는지만 답하세요.',sci:'홀랜드 RIASEC 6유형 48문항. 한 문항에 활동 하나만 담고, 성별에 따라 응답이 크게 갈리는 문항은 교체했습니다. 상위 유형이 측정 오차 안에서 겹치면 그 유형에 대해서만 심화 문항이 추가됩니다.'},3:{n:'3부 일의 엔진',c:'#D85A30',hint:'다른 것을 포기하더라도 이것만은 지키고 싶은가',title:'3부 · 무엇을 위해 일하는가',guide:'대부분 다 중요하게 느껴질 겁니다. “다른 것을 포기하더라도 이것만은”이라는 기준으로 답할수록 결과가 정확해집니다. 끝나면 포기 토너먼트가 이어집니다.',sci:'샤인의 커리어 앵커 8유형 48문항. 모든 항목에 “그렇다”가 몰리는 천장 효과를 막기 위해 문항 점수와 강제 순위 게임을 절반씩 합산합니다.'}};
const HD={H:['원칙과 공정함을 중시하고 과시나 조작을 불편해합니다. 신뢰가 곧 자산인 일(감사, 금융 리스크, 의료, 공공)에서 강력한 무기가 되지만, 정치적인 조직에서는 손해 본다고 느낄 수 있습니다.','목표를 위해 전략적으로 자신을 연출하고 협상할 줄 압니다. 영업·협상·경쟁 환경에서 유리하지만, 장기적인 평판 관리가 커리어의 숨은 변수가 됩니다.'],E:['위험 신호와 타인의 감정을 누구보다 먼저 감지합니다. 공감과 리스크 예측에 강하지만, 상시 고압·갈등 환경에서는 소진 속도가 빠릅니다.','압박 속에서도 평정을 유지하고 혼자 버티는 힘이 강합니다. 위기 대응과 고위험 업무에 유리하지만, 주변 사람의 불안을 과소평가하지 않도록 주의가 필요합니다.'],X:['사람과의 교류에서 에너지를 얻고, 주목받는 자리에서 실력이 올라갑니다. 발표·영업·리더십 역할에 유리하며, 혼자 하는 업무가 길어지면 활력이 떨어집니다.','혼자 깊이 몰입할 때 에너지가 차오릅니다. 서면 소통과 1:1 관계에서 강하며, 대규모 네트워킹은 능력의 문제가 아니라 에너지 비용의 문제입니다.'],A:['갈등을 흡수하고 관계를 회복시키는 팀의 접착제입니다. 다만 자기주장이 필요한 순간(연봉 협상, 부당한 요구)에 손해를 볼 수 있습니다.','기준이 높고 비판에 거리낌이 없습니다. 품질 관리·협상·감사처럼 “아니오”를 말해야 하는 역할에서 강하며, 팀 내 마찰 관리가 과제입니다.'],C:['계획하고 끝까지 정확하게 마무리합니다. 거의 모든 직무의 성과를 예측하는 가장 강력한 성격 요인이지만, 과하면 완벽주의로 속도가 떨어집니다.','즉흥성과 유연성이 강점입니다. 빠르게 변하는 환경에 잘 적응하며, 마감과 디테일은 의지보다 시스템(도구·동료)으로 보완하는 것이 효율적입니다.'],O:['새로운 아이디어, 미감, 추상적 사고에 끌립니다. 창작·연구·전략 업무에서 빛나며, 같은 일이 반복되면 빨리 지루해집니다.','검증된 방법과 실용성을 중시합니다. 안정적인 운영과 실행에서 신뢰를 얻으며, 방향이 자주 바뀌는 환경에서는 피로가 큽니다.']};
const RD={R:'손과 도구로 실물을 다루고 눈에 보이는 결과를 낼 때 몰입합니다. 말보다 결과물로 증명하는 사람입니다.',I:'현상의 원리를 이해할 때까지 파고듭니다. 정답이 정해지지 않은 문제를 분석하는 것 자체가 보상입니다.',A:'정해진 틀 없이 새로운 것을 표현하고 만들어낼 때 살아납니다. 자율성과 미적 기준이 일의 질을 좌우합니다.',S:'사람을 돕고 가르치고 성장시키는 데서 의미를 얻습니다. 내 일의 결과가 사람의 변화로 보일 때 가장 힘이 납니다.',E:'사람과 자원을 움직여 목표를 달성하는 데서 에너지를 얻습니다. 영향력, 경쟁, 성과가 핵심 동기입니다.',C:'혼란을 질서로 바꾸는 데 탁월합니다. 명확한 기준과 정확한 처리, 잘 돌아가는 시스템에서 만족을 느낍니다.'};

const CRAFT={R:'업무 중 직접 만들어보는 부분(프로토타입, 현장 점검, 장비·도구 세팅)을 자청해 손으로 결과를 내는 시간을 확보하세요.',I:'회의 전 데이터와 근거를 정리하거나 문제 원인 분석 리포트를 맡아 “왜”를 파는 역할을 공식화하세요.',A:'보고서·발표 자료의 시각화, 네이밍, 콘셉트 작업처럼 표현이 필요한 일을 끌어오세요.',S:'신입 온보딩, 멘토링, 사내 교육처럼 사람을 돕는 역할을 공식 업무로 만드세요.',E:'작은 프로젝트의 리드나 외부 협상·발표를 맡아 영향력을 행사할 무대를 만드세요.',C:'팀의 업무 프로세스·템플릿·체크리스트를 만드는 역할을 맡아 질서를 설계하세요.'};
const AD={TF:'한 분야의 깊은 전문성이 정체성의 중심입니다. 범용 관리자로 승진하는 것보다 “그 분야 최고”로 남는 것이 더 큰 보상입니다.',GM:'사람과 자원을 통합해 큰 결과를 책임지는 자리를 원합니다. 권한과 영향력의 확장이 성장의 척도입니다.',AU:'일의 방식과 시간을 스스로 정할 자유가 가장 중요합니다. 간섭과 세세한 통제는 성과보다 의욕을 먼저 무너뜨립니다.',SE:'예측 가능성과 고용 안정이 심리적 기반입니다. 이것이 확보될 때 오히려 더 과감하게 실력을 발휘합니다.',EC:'자기 것을 처음부터 만들어내는 것이 핵심 동기입니다. 남이 만든 시스템의 운영자로는 오래 만족하기 어렵습니다.',SV:'일이 세상과 사람에게 의미 있는 변화를 만든다는 확신이 필요합니다. 의미가 사라지면 보상이 커도 공허해집니다.',CH:'불가능해 보이는 문제와 강한 경쟁자가 연료입니다. 쉬운 일이 반복되면 성과와 별개로 빠르게 이탈합니다.',LS:'일은 삶 전체의 한 부분입니다. 일·관계·건강의 통합이 성공의 정의이며, 이것을 침해하는 기회는 기회가 아닙니다.'};
